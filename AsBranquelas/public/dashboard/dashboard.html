<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>As Branquelas | Dashboard</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="icon" href="../assets/icon/favicon2.ico">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/sessao.js"></script>
</head>

<body onload="validarSessao(); carregarDashboard();">
    <div class="janela">
        <!-- Menu lateral (padrão web-data-viz) -->
        <aside class="header-left">
            <div class="logo-box">
                <img src="../assets/img/titulo.png" alt="As Branquelas" class="logo-dash">
            </div>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <nav class="menu-nav">
                <a href="../index.html" class="btn-nav-white">Inicial</a>
                <a href="../simulador.html" class="btn-nav-white">Quiz</a>
                <a href="./dashboard.html" class="btn-nav active">Dashboard</a>
            </nav>

            <div class="btn-logout" onclick="limparSessao()">
                Sair
            </div>
        </aside>

        <!-- Área dos indicadores e gráficos -->
        <main class="dash">
            <div class="dash-topo">
                <h2>Resultados do Quiz</h2>
                <a href="../simulador.html" class="btn-jogar">Jogar novamente</a>
            </div>

            <!-- 4 KPIs -->
            <section class="kpis-container">
                <div class="kpi-card kpi-rosa">
                    <span class="kpi-titulo">Partidas jogadas</span>
                    <strong class="kpi-valor" id="kpi_tentativas">0</strong>
                </div>

                <div class="kpi-card kpi-azul">
                    <span class="kpi-titulo">Melhor pontuação</span>
                    <strong class="kpi-valor" id="kpi_recorde">0 / 0</strong>
                </div>

                <div class="kpi-card kpi-rosa">
                    <span class="kpi-titulo">Média de acertos</span>
                    <strong class="kpi-valor" id="kpi_media">0.0</strong>
                </div>

                <div class="kpi-card kpi-azul">
                    <span class="kpi-titulo">Aproveitamento</span>
                    <strong class="kpi-valor" id="kpi_aproveitamento">0%</strong>
                </div>
            </section>

            <!-- 3 Gráficos -->
            <section class="graficos-grid">
                <div class="grafico-card">
                    <h3>Evolução por tentativa</h3>
                    <div class="canvas-box">
                        <canvas id="graficoEvolucao"></canvas>
                    </div>
                </div>

                <div class="grafico-card">
                    <h3>Acertos e erros</h3>
                    <div class="canvas-box">
                        <canvas id="graficoDesempenho"></canvas>
                    </div>
                </div>

                <div class="grafico-card grafico-largo">
                    <h3>Questões mais erradas</h3>
                    <div class="canvas-box">
                        <canvas id="graficoQuestoesErradas"></canvas>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/dashboard.js"></script>
</body>

</html>
